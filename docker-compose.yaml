version: "3.9"
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./data.js:/docker-entrypoint-initdb.d/data.js:ro
    environment:
      MONGO_INITDB_DATABASE: eventdb

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/eventdb
