openapi: 3.0.3
info:
  title: Event Manager API - MongoDB
  version: 2.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserCreate:
      type: object
      required: [login, password, first_name, last_name, email]
      properties:
        login: { type: string }
        password: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
    EventCreate:
      type: object
      required: [title, date]
      properties:
        title: { type: string }
        description: { type: string }
        date: { type: string, format: date }
        location: { type: string }
    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        date: { type: string }
        location: { type: string }
        organizer_id: { type: string }
    Participant:
      type: object
      properties:
        user_id: { type: string }
        registered_at: { type: string }

paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Logout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out

  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
        '409':
          description: Login exists

  /users/{login}:
    get:
      summary: Get user by login
      security: [{ bearerAuth: [] }]
      parameters:
        - name: login
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          description: Not found

  /users/search:
    get:
      summary: Search users
      security: [{ bearerAuth: [] }]
      parameters:
        - name: first_name
          in: query
          schema: { type: string }
        - name: last_name
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /events:
    post:
      summary: Create event
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Created
    get:
      summary: Get all events
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/search:
    get:
      summary: Search events by date
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{event_id}/register:
    post:
      summary: Register for event
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Registered

  /events/{event_id}/participants:
    get:
      summary: Get event participants
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Participant' }

  /users/me/events:
    get:
      summary: Get user events
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{event_id}/unregister:
    delete:
      summary: Unregister from event
      security: [{ bearerAuth: [] }]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unregistered
